<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwort zurücksetzen - KI Signal Hub</title>
  <link rel="stylesheet" href="tailwind.css">
  <script src="icons.js"></script>
  <script src="db.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-center bg-black text-zinc-400 font-sans min-h-screen">
  <div class="animated-bg"></div>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand"><span class="nav-logo">KI</span><span>SIGNAL<em>HUB</em></span></a>
      <div class="nav-actions">
        <span id="nav-auth"></span>
      </div>
    </div>
  </nav>

  <div class="glass-card w-full max-w-md p-8 rounded-3xl relative z-10">
    <div class="text-center mb-10">
      <div class="w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center text-black font-bold mx-auto mb-4 shadow-[0_0_20px_rgba(16,185,129,0.4)]">🔑</div>
      <h1 class="text-3xl font-black text-white tracking-tight">Passwort <span class="text-emerald-500">Zurücksetzen</span></h1>
      <p class="text-zinc-500 mt-2">E-Mail eingeben – du erhältst einen Reset-Link mit 24h-Gültigkeit.</p>
    </div>

    <div id="reset-msg" class="hidden mb-4 p-3 rounded-xl text-sm font-bold"></div>

    <form id="forgot-form" class="space-y-6">
      <div class="space-y-2">
        <label class="text-xs uppercase font-bold text-zinc-500 block">Email-Adresse</label>
        <input type="email" id="forgot-email" required class="w-full bg-black/40 border border-zinc-800 rounded-xl px-4 py-3 text-white outline-none focus:border-emerald-500/50 transition-colors" placeholder="name@beispiel.de">
      </div>
      <button type="submit" class="glow-button w-full py-4 rounded-xl font-bold">Reset-Link anfordern</button>
    </form>

    <div class="mt-8 text-center">
      <p class="text-sm text-zinc-500"><a href="login.html" class="text-white font-bold hover:text-emerald-400 transition-colors">← Zurück zum Login</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="support-chat.js"></script>
  <script>
    (function () {
      var form = document.getElementById('forgot-form');
      var msg = document.getElementById('reset-msg');
      function show(text, ok) {
        msg.textContent = text;
        msg.className = 'mb-4 p-3 rounded-xl text-sm font-bold ' + (ok ? 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-400' : 'bg-red-500/10 border border-red-500/20 text-red-400');
      }
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var email = document.getElementById('forgot-email').value.trim().toLowerCase();
        var user = await db.get('SELECT id FROM users WHERE email = ?', [email]);
        if (!user) {
          show('Wenn ein Konto existiert, wurde ein Reset-Link erstellt. Bitte E-Mail prüfen.', true);
          return;
        }
        var arr = new Uint8Array(24); crypto.getRandomValues(arr);
        var token = Array.from(arr).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        var expires = new Date(Date.now() + 24 * 864e5).toISOString();
        await db.run('CREATE TABLE IF NOT EXISTS password_resets (token TEXT PRIMARY KEY, user_id INTEGER, expires_at TEXT, used INTEGER DEFAULT 0)');
        await db.run('INSERT INTO password_resets (token, user_id, expires_at) VALUES (?, ?, ?)', [token, user.id, expires]);
        var base = location.href.split('?')[0].replace('forgot-password.html', '');
        var link = base + 'reset-password.html?token=' + token;
        // Demo-Umgebung ohne Mailserver: Link direkt anzeigen + Mailto-Angebot
        show('✓ Reset-Link erstellt (24h gültig):', true);
        var box = document.createElement('div');
        box.className = 'mt-3 p-3 rounded-xl bg-black/40 border border-zinc-800 break-all';
        var a = document.createElement('a');
        a.href = link; a.textContent = link;
        a.className = 'text-emerald-400 font-mono text-xs break-all';
        box.appendChild(a);
        form.parentNode.insertBefore(box, form.nextSibling);
        form.reset();
      });
    })();
  </script>
</body>
</html>
