<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neues Passwort setzen - KI Signal Hub</title>
  <link rel="stylesheet" href="tailwind.css">
  <script src="icons.js"></script>
  <script src="db.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-center bg-black text-zinc-400 font-sans min-h-screen">
  <div class="animated-bg"></div>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand"><span class="nav-logo">KI</span><span>SIGNAL<em>HUB</em></span></a>
      <div class="nav-actions">
        <span id="nav-auth"></span>
      </div>
    </div>
  </nav>

  <div class="glass-card w-full max-w-md p-8 rounded-3xl relative z-10">
    <div class="text-center mb-10">
      <div class="w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center text-black font-bold mx-auto mb-4 shadow-[0_0_20px_rgba(16,185,129,0.4)]">🔒</div>
      <h1 class="text-3xl font-black text-white tracking-tight">Neues <span class="text-emerald-500">Passwort</span></h1>
      <p class="text-zinc-500 mt-2">Setze ein neues Passwort für dein Konto.</p>
    </div>

    <div id="reset-state" class="mb-4 p-3 rounded-xl text-sm font-bold hidden"></div>

    <form id="reset-form" class="space-y-6">
      <div class="space-y-2">
        <label class="text-xs uppercase font-bold text-zinc-500 block">Neues Passwort</label>
        <input type="password" id="reset-pass" required class="w-full bg-black/40 border border-zinc-800 rounded-xl px-4 py-3 text-white outline-none focus:border-emerald-500/50 transition-colors" placeholder="min. 8 Zeichen">
      </div>
      <div class="space-y-2">
        <label class="text-xs uppercase font-bold text-zinc-500 block">Passwort bestätigen</label>
        <input type="password" id="reset-pass2" required class="w-full bg-black/40 border border-zinc-800 rounded-xl px-4 py-3 text-white outline-none focus:border-emerald-500/50 transition-colors" placeholder="••••••••">
      </div>
      <button type="submit" class="glow-button w-full py-4 rounded-xl font-bold">Passwort speichern</button>
    </form>

    <div class="mt-8 text-center">
      <p class="text-sm text-zinc-500"><a href="login.html" class="text-white font-bold hover:text-emerald-400 transition-colors">Zum Login →</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="support-chat.js"></script>
  <script>
    (function () {
      var state = document.getElementById('reset-state');
      var form = document.getElementById('reset-form');
      function show(text, ok) {
        state.textContent = text;
        state.className = 'mb-4 p-3 rounded-xl text-sm font-bold ' + (ok ? 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-400' : 'bg-red-500/10 border border-red-500/20 text-red-400');
      }
      function tokenFromUrl() {
        return new URLSearchParams(location.search).get('token') || '';
      }
      async function validate() {
        var token = tokenFromUrl();
        if (!token) { show('Kein Token in der URL – bitte über die „Passwort vergessen"-Seite anfordern.', false); form.classList.add('hidden'); return null; }
        var row = await db.get('SELECT * FROM password_resets WHERE token = ?', [token]);
        if (!row) { show('Ungültiger Reset-Link.', false); form.classList.add('hidden'); return null; }
        if (row.used) { show('Dieser Reset-Link wurde bereits verwendet.', false); form.classList.add('hidden'); return null; }
        if (new Date(row.expires_at).getTime() < Date.now()) { show('Der Reset-Link ist abgelaufen (24h-Gültigkeit).', false); form.classList.add('hidden'); return null; }
        state.classList.add('hidden');
        return row;
      }
      validate();
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var row = await validate();
        if (!row) return;
        var p1 = document.getElementById('reset-pass').value;
        var p2 = document.getElementById('reset-pass2').value;
        if (p1.length < 8) { show('Das Passwort muss mindestens 8 Zeichen lang sein.', false); return; }
        if (p1 !== p2) { show('Die Passwörter stimmen nicht überein.', false); return; }
        var hash = await window.auth.hashPassword(p1);
        await db.run('UPDATE users SET password_hash = ? WHERE id = ?', [hash, row.user_id]);
        await db.run('UPDATE password_resets SET used = 1 WHERE token = ?', [row.token]);
        // Alle bestehenden Sessions invalidieren (Sicherheit nach Passwortwechsel)
        await db.run('DELETE FROM auth_sessions WHERE user_id = ?', [row.user_id]);
        show('✓ Passwort geändert – alle Sessions wurden abgemeldet. Weiter zum Login …', true);
        setTimeout(function () { window.location.href = 'login.html'; }, 1800);
      });
    })();
  </script>
</body>
</html>
